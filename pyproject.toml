[project]
name = "intern-queue"
version = "0.1.0"
description = "Detect, dedupe, rank, and stage internship postings. You press Submit."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
enrich = ["anthropic>=0.40"]

[project.scripts]
intern-queue = "intern_queue.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intern_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
