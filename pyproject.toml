[project]
name = "intern-queue"
version = "0.1.0"
description = "Detect, dedupe, rank, and stage internship postings. You press Submit."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # Used *only* by the optional Phase 2 enrichment step, but shipped by default:
    # as an extra, a plain `uv sync` left the Enrich button broken with a message
    # telling you to re-run install with a different flag.
    "anthropic>=0.40",
]

[project.optional-dependencies]
enrich = []  # kept so `uv sync --extra enrich` from older docs still resolves

[project.scripts]
intern-queue = "intern_queue.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intern_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
